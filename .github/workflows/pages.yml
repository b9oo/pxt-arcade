name: Build and Deploy Custom Arcade
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install PXT Engine & Core Target Libraries
        run: |
          npm install -g pxt
          npm install pxt-arcade
          npm install
          
      - name: Compile Static App Assets
        run: |
          pxt target arcade
          pxt buildtarget --pages
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Static Web Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: './built/web'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site Live to Pages
        id: deployment
        uses: actions/deploy-pages@v4
